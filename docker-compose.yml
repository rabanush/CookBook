services:
  mongodb:
    image: mongo:7.0
    container_name: cookbook-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: cookbook
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - cookbook-network

  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: cookbook-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=cookbook
    ports:
      - "8001:8001"
    depends_on:
      - mongodb
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - cookbook-network

  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: cookbook-frontend
    restart: unless-stopped
    ports:
      - "80:80"  
    depends_on:
      - backend
    networks:
      - cookbook-network

volumes:
  mongodb_data:
    driver: local

networks:
  cookbook-network:
    driver: bridge